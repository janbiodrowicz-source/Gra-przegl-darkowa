  <script>
    // Tryb ?debug=1: zbieranie błędów od samego startu strony (okienko w js/dev/debug.js je pokazuje)
    if (/[?&]debug/.test(location.search)) {
      window.__bledy = [];
      const dodaj = (t) => { window.__bledy.push(t); if (window.__bledy.length > 30) window.__bledy.shift(); };
      addEventListener('error', (e) => dodaj(`${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`));
      addEventListener('unhandledrejection', (e) => dodaj('obietnica: ' + ((e.reason && e.reason.message) || e.reason)));
      const err = console.error;
      console.error = (...a) => { dodaj('console.error: ' + a.map(String).join(' ')); err.apply(console, a); };
    }
  </script>
